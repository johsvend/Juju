# Tests everything and builds Juju.zip (the addon) on every change.
# Unzip into Interface/AddOns.
# The zip is attached to the workflow run (Actions -> run -> Artifacts).
name: Bygg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dataverktøyene
        run: python -m unittest discover -s tests -v

      - name: Test Juju-mottakeren (Cloudflare Worker)
        working-directory: cloudflare
        run: node --test

      - name: Sjekk Lua-syntaks
        run: |
          sudo apt-get install -y -qq lua5.1 > /dev/null
          for f in Juju/*.lua; do luac5.1 -p "$f" || exit 1; done
          echo "Alle Lua-filer OK"

      - name: Sjekk PowerShell-syntaks
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem uploader/*.ps1) {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            if ($err.Count) { $bad++; $err | ForEach-Object { Write-Error "$($f.Name): $_" } }
          }
          if ($bad) { exit 1 } else { "Alle PowerShell-filer OK" }

      # Players get the addon only: sharing happens in-game. The uploader
      # (uploader/) is the maintainer's tool and is not part of the download.
      - name: Lag Juju.zip
        run: |
          mkdir -p dist
          cp -r Juju dist/Juju
          cp LICENSE README.md dist/Juju/
          (cd dist && zip -r -q ../Juju.zip Juju)
          unzip -l Juju.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Juju
          path: Juju.zip
